schema_version = "1.0.0"

id = "mbtoolkit"
version = "0.3.0"
name = "MBToolkit"
tagline = "Personal hard surface workflow toolkit"
maintainer = "Marius Brill"
type = "add-on"
website = "https://github.com/marius-brill/MBToolkit"

blender_version_min = "5.2.0"

license = ["SPDX:GPL-3.0-or-later"]

[permissions]
files = "Run selected scripts and read/write bake projects and textures"
network = "Connect to Substance Painter on localhost for baking"

[build]
paths_exclude_pattern = [
    "__pycache__/",
    "/.git/",
    "/*.zip",
    "/.vscode/",
    "/tests/",
    "/.github/",
    "/dist/",
    "*.py[cod]",
    "/.gitignore",
    "/.gitattributes",
    "/.editorconfig",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
]
